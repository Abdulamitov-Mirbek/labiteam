plugins {
    id 'com.android.application'
}

android {
    namespace 'kg.signal.meter'
    compileSdk 34

    defaultConfig {
        applicationId 'kg.signal.meter'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Постоянный отладочный ключ из репозитория: иначе GitHub при каждой сборке подписывает
    // APK новым случайным ключом, и новая версия не ставится поверх старой
    // («Приложение не установлено»). Ключ отладочный, пароль стандартный — не для магазина.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
