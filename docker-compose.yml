services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      # Секрет HMAC. Если не задан — генерируется случайный при старте процесса.
      OTP_SECRET: ${OTP_SECRET:-}
      # Токен для /dashboard и /admin/events (пусто = без авторизации).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
