# Сигнал.kg на сервере RUBA. Отдельный проект, портов не публикует.
# HTTPS идёт через Caddy RUBA по сети ruba_default (см. DEPLOY.md).
#   docker compose -f docker-compose.prod.yml up -d --build
name: signalkg

services:
  web:
    build: .
    image: signalkg-web
    container_name: signalkg-web
    restart: unless-stopped
    environment:
      COMPLAINTS_FILE: /srv/var/complaints.jsonl
      DGIS_KEY: ${DGIS_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://house.kg,https://www.house.kg,https://lalafo.kg,https://www.lalafo.kg}
    volumes:
      - var:/srv/var
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ruba_default   # внешняя сеть RUBA: по ней Caddy отдаёт сайт по HTTPS
      - internal

volumes:
  var:

networks:
  ruba_default:
    external: true
  internal:
