<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTP — события безопасности</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1c2026; --muted:#6b7480;
          --ok:#1f8a4c; --warn:#b26a00; --bad:#c62f2f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --card:#1d2126; --line:#2c323a; --text:#e6e9ed; --muted:#939ca8;
            --ok:#4cc27d; --warn:#e0a040; --bad:#f07070; }
  }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text);
         font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile b { display:block; font-size:26px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:12px; }
  .wrap { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:0; }
  td.mono { font-family:ui-monospace, Menlo, Consolas, monospace; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); font-weight:600; }
  .empty { padding:24px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<h1>События безопасности OTP</h1>
<div class="sub" id="sub">Загрузка…</div>
<div class="tiles" id="tiles"></div>
<div class="wrap">
  <table>
    <thead><tr><th>Время</th><th>Событие</th><th>Номер</th><th>IP</th><th>Детали</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Событий пока нет</div>
</div>
<script>
const LABELS = {
  otp_issued: ["Код выдан", "ok"],
  verify_success: ["Успешная проверка", "ok"],
  verify_failed: ["Неверный код", "warn"],
  verify_no_active_code: ["Нет действующего кода", "warn"],
  send_rate_limited: ["Лимит отправки", "warn"],
  ip_rate_limited: ["Лимит по IP", "bad"],
  msisdn_blocked: ["Номер заблокирован", "bad"],
  verify_while_blocked: ["Попытка при блокировке", "bad"],
};
const TILES = ["otp_issued", "verify_success", "verify_failed", "msisdn_blocked", "ip_rate_limited", "send_rate_limited"];
const token = new URLSearchParams(location.search).get("token");

function cell(text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

async function refresh() {
  const sub = document.getElementById("sub");
  try {
    const res = await fetch("admin/events?limit=500" + (token ? "&token=" + encodeURIComponent(token) : ""));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const counts = {};
    for (const e of data.events) counts[e.event] = (counts[e.event] || 0) + 1;

    const tiles = document.getElementById("tiles");
    tiles.replaceChildren(...TILES.map(key => {
      const div = document.createElement("div");
      div.className = "tile";
      const b = document.createElement("b");
      b.textContent = counts[key] || 0;
      b.className = LABELS[key][1];
      const span = document.createElement("span");
      span.textContent = LABELS[key][0];
      div.append(b, span);
      return div;
    }));

    const rows = document.getElementById("rows");
    rows.replaceChildren(...data.events.map(e => {
      const tr = document.createElement("tr");
      const [label, cls] = LABELS[e.event] || [e.event, ""];
      const { ts, event, msisdn, ip, ...rest } = e;
      const details = Object.entries(rest).map(([k, v]) => k + "=" + v).join(", ");
      tr.append(
        cell(new Date(ts).toLocaleTimeString("ru-RU"), "mono"),
        cell(label, cls), cell(msisdn, "mono"), cell(ip, "mono"), cell(details),
      );
      return tr;
    }));
    document.getElementById("empty").hidden = data.events.length > 0;
    sub.textContent = "Последние " + data.events.length + " событий · хранилище: " + data.store +
      " · обновлено " + new Date().toLocaleTimeString("ru-RU");
  } catch (err) {
    sub.textContent = "Не удалось загрузить события: " + err.message;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
