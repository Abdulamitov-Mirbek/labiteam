name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Установить платформу и build-tools
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Сборка debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверка APK (валидный и устанавливаемый)
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "размер: $(stat -c%s "$APK") байт"
          echo "=== состав ==="
          unzip -l "$APK" | grep -iE "AndroidManifest.xml|classes.dex|resources.arsc|CERT.RSA"
          echo "=== badging (пакет / активность / разрешения) ==="
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -iE "^package:|launchable-activity:|uses-permission:|sdkVersion:|targetSdkVersion:"

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: signalkg-meter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
